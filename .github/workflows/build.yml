name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x ./gradlew
      - name: Make signing key
        run: |
          keytool -genkeypair -keystore my.jks -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass mypass123 -keypass mypass123 -dname "CN=Me"
          printf "storeFile=../my.jks\nstorePassword=mypass123\nkeyAlias=mykey\nkeyPassword=mypass123\n" > keystore.properties
      - run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: flowpay-apk
          path: app/build/outputs/apk/release/*.apk
